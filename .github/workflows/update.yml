name: Update listings
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Scrape
        run: |
          python - <<'PY'
          import json, re, datetime
          from playwright.sync_api import sync_playwright

          SRC = [
            ("Belediye / Yerel Yönetim", ["https://yerelyonetimler.csb.gov.tr/"]),
            ("Kamu Kurumları İlanları", ["https://kamuilan.sbb.gov.tr/"]),
            ("İŞKUR", ["https://www.iskur.gov.tr/ilanlar/kurumdisi-kamu-isci-alim-ilanlari/", "https://www.iskur.gov.tr/duyurular/"]),
            ("Resmî Gazete", ["https://www.resmigazete.gov.tr/"]),
            ("İlan.gov.tr", ["https://www.ilan.gov.tr/"]),
            ("Kariyer Kapısı", ["https://kariyerkapisi.gov.tr/isealim", "https://kariyerkapisi.gov.tr/"]),
          ]
          KEY = re.compile(r"alım|alim|personel|işçi|isci|memur|sözleşmeli|kadro|sınav|başvuru|ilan", re.I)
          BAD = re.compile(r"ihale|televizyon|dns|siem|ekipman|zeyilname|sonuç|sonuc|belgeler|meslekleri|gizlilik|çerez", re.I)
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          try:
              prev = {i["u"]: i["d"] for i in json.load(open("data.json"))["items"]}
          except Exception:
              prev = {}

          today = datetime.date.today().isoformat()
          items, status, seen = [], [], set()

          with sync_playwright() as pw:
              br = pw.chromium.launch()
              ctx = br.new_context(user_agent=UA, ignore_https_errors=True, locale="tr-TR")
              for name, urls in SRC:
                  n = 0; err = ""
                  for url in urls:
                      try:
                          pg = ctx.new_page()
                          pg.goto(url, wait_until="domcontentloaded", timeout=45000)
                          pg.wait_for_timeout(6000)
                          links = pg.eval_on_selector_all("a[href]", "els => els.map(e => [(e.innerText||'').trim(), e.href])")
                          pg.close()
                      except Exception as e:
                          err = str(e).split("\n")[0][:120]
                          continue
                      for t, u in links:
                          t = re.sub(r"\s+", " ", t).strip()
                          if len(t) < 20 or not u.startswith("http") or u in seen: continue
                          if not KEY.search(t) or BAD.search(t): continue
                          seen.add(u); n += 1
                          items.append({"s": name, "t": t, "u": u, "d": prev.get(u, today)})
                          if n >= 40: break
                  status.append({"name": name, "url": urls[0], "ok": n > 0, "count": n, "error": "" if n else (err or "ilan bulunamadı")})
              br.close()

          out = {"updated": datetime.datetime.utcnow().isoformat() + "Z", "sources": status, "items": items}
          json.dump(out, open("data.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(status, ensure_ascii=False, indent=1))
          PY
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update listings" && git push)
