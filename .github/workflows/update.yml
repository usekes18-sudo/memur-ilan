name: Update listings
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape
        run: |
          python - <<'PY'
          import json, re, ssl, datetime, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          SRC = [
            ("Belediye / Yerel Yönetim", "https://yerelyonetimler.csb.gov.tr/"),
            ("Kamu Kurumları İlanları", "https://kamuilan.sbb.gov.tr/"),
            ("İŞKUR", "https://www.iskur.gov.tr/"),
            ("Resmî Gazete", "https://www.resmigazete.gov.tr/"),
            ("İlan.gov.tr", "https://www.ilan.gov.tr/"),
            ("Kariyer Kapısı", "https://kariyerkapisi.gov.tr/"),
          ]
          KEY = re.compile(r"alım|alim|personel|işçi|isci|memur|sözleşmeli|kadro|sınav|başvuru|ilan", re.I)
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}

          class P(HTMLParser):
              def __init__(s, base):
                  super().__init__(); s.b = base; s.h = None; s.t = ""; s.out = []
              def handle_starttag(s, tag, a):
                  if tag == "a":
                      s.h = dict(a).get("href"); s.t = ""
              def handle_data(s, d):
                  if s.h is not None: s.t += d
              def handle_endtag(s, tag):
                  if tag == "a" and s.h is not None:
                      t = re.sub(r"\s+", " ", s.t).strip()
                      if len(t) >= 20 and KEY.search(t) and not s.h.startswith(("#", "javascript", "mailto")):
                          s.out.append((t, urljoin(s.b, s.h)))
                      s.h = None

          def get(url):
              for ctx in (None, ssl._create_unverified_context()):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30, context=ctx)
                      return r.read().decode("utf-8", "ignore")
                  except Exception as e:
                      err = str(e)
              raise Exception(err)

          try:
              prev = {i["u"]: i["d"] for i in json.load(open("data.json"))["items"]}
          except Exception:
              prev = {}

          today = datetime.date.today().isoformat()
          items, status, seen = [], [], set()
          for name, url in SRC:
              try:
                  p = P(url); p.feed(get(url)); n = 0
                  for t, u in p.out:
                      if u in seen: continue
                      seen.add(u); n += 1
                      items.append({"s": name, "t": t, "u": u, "d": prev.get(u, today)})
                      if n >= 40: break
                  status.append({"name": name, "url": url, "ok": n > 0, "count": n, "error": "" if n else "ilan bulunamadı"})
              except Exception as e:
                  status.append({"name": name, "url": url, "ok": False, "count": 0, "error": str(e)[:120]})

          out = {"updated": datetime.datetime.utcnow().isoformat() + "Z", "sources": status, "items": items}
          json.dump(out, open("data.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(status, ensure_ascii=False, indent=1))
          PY
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update listings" && git push)
