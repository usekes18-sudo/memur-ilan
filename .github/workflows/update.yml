name: Update listings
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Scrape
        run: |
          python - <<'PY'
          import json, re, datetime
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          KEY = re.compile(r"alım|alim|personel|işçi|isci|memur|kadro|sözleşmeli|sozlesmeli", re.I)
          BAD = re.compile(r"ihale|televizyon|dns|siem|ekipman|zeyilname|sonuç|sonuc|belgeler|meslekleri|çerez", re.I)
          KEYG = re.compile(r"atama|personel|kadro|alım|alim|sınav|öğretim|memur|işçi", re.I)
          BADG = re.compile(r"ihale|artırma|eksiltme|döviz|enerji piyasası|nükleer", re.I)

          try:
              prev = {i["u"]: i["d"] for i in json.load(open("data.json"))["items"]}
          except Exception:
              prev = {}
          today = datetime.date.today().isoformat()
          items, status, seen = [], [], set()

          def add(src, t, u):
              if u in seen: return False
              seen.add(u)
              items.append({"s": src, "t": t, "u": u, "d": prev.get(u, today)})
              return True

          def get_links(ctx, url, wait=6000, timeout=45000):
              pg = ctx.new_page()
              try:
                  pg.goto(url, wait_until="domcontentloaded", timeout=timeout)
                  pg.wait_for_timeout(wait)
                  return pg.eval_on_selector_all("a[href]", "els => els.map(e => [(e.innerText||'').trim(), e.href])")
              finally:
                  pg.close()

          def fin(name, url, n, err, pin=None):
              if n == 0 and pin:
                  add(name, pin, url)
              status.append({"name": name, "url": url, "ok": n > 0, "count": n, "error": "" if n else err})

          with sync_playwright() as pw:
              br = pw.chromium.launch()
              ctx = br.new_context(user_agent=UA, ignore_https_errors=True, locale="tr-TR")

              # 1) Belediye / Yerel Yönetim
              name = "Belediye / Yerel Yönetim"; url = "https://yerelyonetimler.csb.gov.tr/"; n = 0; err = "ilan çekilemedi (site erişimi engelliyor olabilir)"
              try:
                  for t, u in get_links(ctx, url, 4000, 20000):
                      t = re.sub(r"\s+", " ", t).strip()
                      if len(t) >= 25 and KEY.search(t) and not BAD.search(t) and add(name, t, u): n += 1
              except Exception as e:
                  err = str(e).split("\n")[0][:100]
              fin(name, url, n, err, "Siteyi aç: Belediye / Yerel Yönetim (otomatik çekilemedi)")

              # 2) Kamu Kurumları İlanları
              name = "Kamu Kurumları İlanları"; url = "https://kamuilan.sbb.gov.tr/"; n = 0; err = "bölge kısıtlaması (403)"
              try:
                  for t, u in get_links(ctx, url, 4000, 20000):
                      t = re.sub(r"\s+", " ", t).strip()
                      if len(t) >= 25 and KEY.search(t) and not BAD.search(t) and add(name, t, u): n += 1
              except Exception as e:
                  err = str(e).split("\n")[0][:100]
              fin(name, url, n, err, "Siteyi aç: Kamu Kurumları İlanları (otomatik çekilemedi)")

              # 3) İŞKUR
              name = "İŞKUR"; url = "https://www.iskur.gov.tr/duyurular/"; n = 0; err = "duyuru bulunamadı"
              add(name, "Kurumdışı Kamu İşçi Alım İlanları (il il listelenir)", "https://www.iskur.gov.tr/ilanlar/kurumdisi-kamu-isci-alim-ilanlari/")
              add(name, "Kamu Memur Alım İlanları", "https://www.iskur.gov.tr/ilanlar/kamu-memur-alim-ilanlari/")
              for pu in ["https://www.iskur.gov.tr/", url]:
                  try:
                      for t, u in get_links(ctx, pu, 4000):
                          t = re.sub(r"\s+", " ", t).strip()
                          if "/duyurular/" in u and len(t) >= 20 and KEY.search(t) and not BAD.search(t) and add(name, t, u): n += 1
                  except Exception as e:
                      err = str(e).split("\n")[0][:100]
              fin(name, url, n, err)

              # 4) Resmî Gazete
              name = "Resmî Gazete"; url = "https://www.resmigazete.gov.tr/"; n = 0; err = "bugün uygun başlık yok"
              try:
                  for t, u in get_links(ctx, url, 3000):
                      t = re.sub(r"\s+", " ", t).strip()
                      t = re.sub(r"^[–—-]+\s*", "", t)
                      if len(t) >= 15 and KEYG.search(t) and not BADG.search(t) and add(name, t, u): n += 1
              except Exception as e:
                  err = str(e).split("\n")[0][:100]
              fin(name, url, n, err)

              # 5) İlan.gov.tr (üst kategori: kamu + akademik)
              base = "https://www.ilan.gov.tr/ilan/kategori/8/kamu-akademik-personel"
              cnt = {"İlan.gov.tr (Kamu)": 0, "İlan.gov.tr (Akademik)": 0}
              err = "ilan bulunamadı"; dry = 0; pages = []
              for p in range(15):
                  try:
                      L = get_links(ctx, base + "?currentPage=" + str(p), 7000)
                  except Exception as e:
                      err = str(e).split("\n")[0][:100]; break
                  found = new = 0
                  for t, u in L:
                      if re.search(r"/ilan/\d+/", u):
                          found += 1
                          lines = [x.strip() for x in t.split("\n") if x.strip()]
                          nm = "İlan.gov.tr (Akademik)" if "akademik-personel-alimlari" in u else "İlan.gov.tr (Kamu)"
                          if lines and add(nm, " — ".join(lines[:2]), u):
                              new += 1; cnt[nm] += 1
                  pages.append(str(new))
                  if found == 0: break
                  dry = dry + 1 if new == 0 else 0
                  if dry >= 2: break
              for nm, c in cnt.items():
                  status.append({"name": nm, "url": base, "ok": c > 0, "count": c, "error": "" if c else err, "pages": ",".join(pages)})

              # 6) Kariyer Kapısı
              # Liste <a> etiketiyle değil, POST api.kariyerkapisi.gov.tr/api/ilan/GetIseAlimPage yanıtıyla geliyor
              name = "Kariyer Kapısı"; url = "https://kariyerkapisi.gov.tr/isealim"; n = 0; err = "API yanıtı alınamadı"
              def lists_in(o):
                  if isinstance(o, list):
                      if o and all(isinstance(x, dict) for x in o): yield o
                      for v in o: yield from lists_in(v)
                  elif isinstance(o, dict):
                      for v in o.values(): yield from lists_in(v)
              def pick(d, pats):
                  for k, v in d.items():
                      if isinstance(v, str) and v.strip() and any(p in k.lower() for p in pats):
                          return re.sub(r"\s+", " ", v).strip()
                  return ""
              caught = []
              try:
                  pg = ctx.new_page()
                  def on_resp(r):
                      if "GetIseAlimPage" in r.url:
                          try: caught.append(r.json())
                          except Exception as e: caught.append({"parse_error": str(e)[:100], "status": r.status})
                  pg.on("response", on_resp)
                  pg.goto(url, wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(10000)
                  pg.close()
                  json.dump(caught, open("debug_kariyer.json", "w"), ensure_ascii=False, indent=1)
                  if not caught:
                      err = "GetIseAlimPage isteği hiç gitmedi"
                  for payload in caught:
                      cands = sorted(lists_in(payload), key=len, reverse=True)
                      if not cands:
                          err = "API yanıtında liste yok (debug_kariyer.json'a bak)"; continue
                      for row in cands[0]:
                          title = pick(row, ["ilanbaslik", "baslik", "ilanadi", "title"])
                          kurum = pick(row, ["kurum", "birim"])
                          rid = str(row.get("id") or row.get("ilanId") or row.get("ilanID") or len(seen))
                          t = " — ".join(x for x in (kurum, title) if x) or "Kariyer Kapısı ilanı #" + rid
                          if add(name, t, url + "#" + rid): n += 1
              except Exception as e:
                  err = str(e).split("\n")[0][:100]
              fin(name, url, n, err, "Siteyi aç: Kariyer Kapısı (otomatik çekilemedi)")

              br.close()

          out = {"updated": datetime.datetime.utcnow().isoformat() + "Z", "sources": status, "items": items}
          json.dump(out, open("data.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(status, ensure_ascii=False, indent=1))
          PY
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git add debug_kariyer.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update listings" && git push)
